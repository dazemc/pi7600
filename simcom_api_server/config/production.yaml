# Production configuration for the Simcom API service.
#
# The service runs on a Raspberry Pi with a local PostgreSQL instance. The
# database password is read from SERVERPOD_DATABASE_PASSWORD (or
# config/passwords.yaml); do not commit it here.
#
# Simcom API's REST and WebSocket routes are registered on the web server, so
# `webServer.port` is the port the API listens on (8000, matching the previous
# service). The Serverpod API/Insights ports are unused by the Simcom API
# contract but must remain valid.

apiServer:
  port: 8080
  publicHost: 192.168.1.11
  publicPort: 8080
  publicScheme: http

insightsServer:
  port: 8081
  publicHost: 192.168.1.11
  publicPort: 8081
  publicScheme: http

webServer:
  port: 8000
  publicHost: 192.168.1.11
  publicPort: 8000
  publicScheme: http

database:
  host: localhost
  port: 5432
  name: simcom_api
  user: simcom_api
  requireSsl: false
  #maxConnectionCount: 10 # Defaults to 10, a negative or null value removes the limit

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

sessionLogs:
  persistentEnabled: false
  # Per-request Serverpod logs are costly on a Pi's SD card. Application logs
  # remain available through SIMCOM_API_LOG_LEVEL and journald.
  consoleEnabled: false
  consoleLogFormat: text
