name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install libserialport
        run: sudo apt-get update && sudo apt-get install -y libserialport0

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          simcom_api_server simcom_api_client simcom_modem

      - name: Analyze server
        run: dart analyze simcom_api_server

      - name: Analyze client
        run: dart analyze simcom_api_client

      - name: Install modem library dependencies
        working-directory: simcom_modem
        run: dart pub get

      - name: Analyze modem library
        working-directory: simcom_modem
        run: dart analyze

  test:
    runs-on: ubuntu-latest
    env:
      LIBSERIALPORT_PATH: libserialport.so.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install libserialport
        run: sudo apt-get update && sudo apt-get install -y libserialport0

      - name: Install dependencies
        run: dart pub get

      - name: Run service tests
        working-directory: simcom_api_server
        run: dart test

      - name: Install modem library dependencies
        working-directory: simcom_modem
        run: dart pub get

      - name: Run modem library tests
        working-directory: simcom_modem
        run: dart test
