name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install libserialport
        run: sudo apt-get update && sudo apt-get install -y libserialport0

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          pi7600_server pi7600_client

      - name: Analyze server
        run: dart analyze pi7600_server

      - name: Analyze client
        run: dart analyze pi7600_client

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install libserialport
        run: sudo apt-get update && sudo apt-get install -y libserialport0

      - name: Install dependencies
        run: dart pub get

      - name: Run hardware-free tests
        working-directory: pi7600_server
        run: dart test
