[project]
name = "pi7600"
version = "0.1.0"
description = "SIMCOM 7600X"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [
    { name = "Daazed McFarland", email = "daazedjmcfarland@gmail.com" },
]
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "fastapi>=0.115.6,<1.0.0",
    "fastapi-cli>=0.0.5",
    "numpy>=2.2.2,<3.0.0",
    "opencv-python-headless>=4.10.0.84,<5.0.0",
    "pydantic>=2.10.3,<3.0.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.10.1,<3.0.0",
    "pyserial>=3.5",
    "python-multipart>=0.0.19",
    "pyyaml>=6.0.2",
    "smspdudecoder>=2.1.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "uvicorn[standard]>=0.32.1",
    "websockets>=14.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["pi7600"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# FastAPI uses function calls in argument defaults for dependency injection.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette's WebSocket TestClient currently warns about httpx vs httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
