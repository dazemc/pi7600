name: _
publish_to: none

environment:
  sdk: '^3.12.2'

workspace:
  - pi7600_client
  - pi7600_server

# Local patch: allow RFC 6455 close codes 1008 (policy violation) and 1011
# (internal error), which the published `relic_io` rejects. The Pi7600
# WebSocket contract requires those codes for failed authentication and a
# missing video capture. See third_party/relic_io/README.patch.md.
dependency_overrides:
  relic_io:
    path: third_party/relic_io
